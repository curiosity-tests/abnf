          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  changelog:
    name: Changelog entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
        persist-credentials: false
        fetch-depth: 0
    - name: A library change carries a changelog entry
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        python3 - <<'PY'
        import os, pathlib, subprocess, sys

        WATCHED = ("src/", "packages/abnf-rust/rust/")
        CHANGELOG = "CHANGELOG.md"

        def git(*args):
            return subprocess.run(
                ["git", *args], capture_output=True, text=True, check=True
            ).stdout

        base = f"origin/{os.environ['BASE_REF']}"
        merge_base = git("merge-base", base, "HEAD").strip()
        changed = git("diff", "--name-only", merge_base, "HEAD").split()

        code = [p for p in changed if p.startswith(WATCHED)]
        if not code:
            print("No library change; a changelog entry is not required.")
            sys.exit(0)

        # The entry has to land in the Unreleased section, not in an
        # already-released one.
        text = pathlib.Path(CHANGELOG).read_text(encoding="utf-8").splitlines()
        try:
            start = text.index("## Unreleased")
        except ValueError:
            print(
                f"::error::{len(code)} library file(s) changed, but {CHANGELOG} has "
                "no '## Unreleased' section.  Add one above the most recent release."
            )
            sys.exit(1)
        end = next(
            (i for i, l in enumerate(text[start + 1 :], start + 1) if l.startswith("## ")),
            len(text),
        )
        unreleased = set(text[start + 1 : end])

        added = [
            l[1:]
            for l in git("diff", "-U0", merge_base, "HEAD", "--", CHANGELOG).splitlines()
            if l.startswith("+") and not l.startswith("+++")
        ]
        if not any(l in unreleased for l in added):
            print(
                f"::error::{len(code)} library file(s) changed, but this branch adds "
                f"nothing to the '## Unreleased' section of {CHANGELOG}.  "
                "Note that heading only exists between releases -- if a release was "
                "just cut, add the section back rather than editing a released one."
            )
            for p in code[:10]:
                print(f"  changed: {p}")
            sys.exit(1)

        print(f"{len(code)} library file(s) changed, and Unreleased gained an entry.")
        PY
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
